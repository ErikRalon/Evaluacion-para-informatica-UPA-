<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro - Evaluación UPA</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Formulario de Registro</h1>
            <a href="index.html" class="back-link">← Volver al inicio</a>
        </header>
        <main>
            <div class="form-card">
                <form id="userForm">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                        <span class="error-message" id="nombre-error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="fecha">Fecha de Nacimiento (dd-mm-yyyy):</label>
                        <input type="text" id="fecha" name="fecha" placeholder="dd-mm-yyyy" required>
                        <span class="error-message" id="fecha-error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="edad">Edad:</label>
                        <input type="text" id="edad" name="edad" value="0" readonly>
                    </div>
                    
                    <div class="form-group">
                        <label for="telefono">Número de Teléfono:</label>
                        <input type="text" id="telefono" name="telefono" required>
                        <span class="error-message" id="telefono-error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="correo">Correo Electrónico:</label>
                        <input type="email" id="correo" name="correo" required>
                        <span class="error-message" id="correo-error"></span>
                    </div>
                    
                    <button type="submit" class="btn primary">Guardar Usuario</button>
                </form>
                <div id="response-message" class="response-message"></div>
            </div>
        </main>
        <footer>
            <p>Evaluación para Informática UPA - 2025</p>
        </footer>
    </div>
    <script src="js/formulario.js"></script>
</body>
</html>
